name: Zola on GitHub Pages

on:
  push:
    branches:
      - dev

jobs:
  build:
    name: Publish site
    runs-on: ubuntu-latest
    steps:
    - name: Checkout dev
      uses: actions/checkout@v3.0.0

    - name: Build and deploy
      uses: shalzz/zola-deploy-action@v0.21.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
